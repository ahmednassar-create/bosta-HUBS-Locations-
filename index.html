<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}

const REGIONS=["القاهرة الكبرى","الإسكندرية والساحل","الدلتا","القناة والبحر الأحمر وسيناء","الصعيد"];

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const locText=h=>h.lat.toFixed(6)+", "+h.lon.toFixed(6);
const isDark=()=>window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches;

const map=L.map("map",{zoomControl:false,minZoom:5,maxZoom:19,zoomSnap:.5,attributionControl:false}).setView([27,30.5],6);

let cur="gov",tilesFailed=false;
/* governorates layer (works offline) */
const govRegion={};HUBS.forEach(h=>govRegion[h.gov]=h.region);govRegion["شمال سيناء"]=REGIONS[3];
let govFilter=null;
function styleGov(){
  const vec=cur==="gov"||tilesFailed,dk=isDark(),sat=cur==="sat"||cur==="dark";
  govLayer.eachLayer(l=>{const n=l.feature.properties.n,sel=govFilter===n,c=RCOL[govRegion[n]]||"#999";
    l.setStyle({color:sel?c:(vec?(dk?"#12151c":"#fff"):(sat?"#fff":"#7a8194")),weight:sel?3:(vec?1.5:.8),opacity:sel?1:(vec?1:.55),
      fillColor:c,fillOpacity:sel?(vec?.55:.22):(vec?.28:.05)});
    if(sel&&l.bringToFront)l.bringToFront();});
}
const govLayer=L.geoJSON(GOV,{onEachFeature:(f,l)=>{
  const n=f.properties.n;
  l.on("click",()=>{govFilter=govFilter===n?null:n;styleGov();chips();refresh(true);});
  l.on("mouseover",()=>{if(govFilter!==n)l.setStyle({fillOpacity:cur==="gov"?.5:.18});});
  l.on("mouseout",()=>styleGov());
  const b=l.getBounds(),sz=Math.max(b.getNorth()-b.getSouth(),b.getEast()-b.getWest());
  l._lbl=L.marker(b.getCenter(),{interactive:false,icon:L.divIcon({className:"gl",html:"<span>"+n+"</span>",iconSize:[0,0]})});
  l._min=sz>2.2?6:sz>1?7:sz>.5?8.5:10;
  l.bindTooltip(()=>"<b>"+n+"</b> · "+HUBS.filter(h=>h.gov===n).length+" فرع",{sticky:true});
}}).addTo(map);
const lblLayer=L.layerGroup().addTo(map);
function govLabels(){lblLayer.clearLayers();const z=map.getZoom();govLayer.eachLayer(l=>{if(z>=l._min)lblLayer.addLayer(l._lbl);});}
map.on("zoomend",govLabels);



let region=null,query="";
const norm=s=>(s||"").toLowerCase();
const visible=h=>{
  if(region&&h.region!==region)return false;
  if(govFilter&&h.gov!==govFilter)return false;
  if(query&&!norm(h.name+" "+h.gov+" "+h.region+" "+h.addr).includes(norm(query)))return false;
  return true;
};
let me=null,meMarker=null;
const dist=(a,b)=>{const R=6371,t=x=>x*Math.PI/180,dLa=t(b.lat-a.lat),dLo=t(b.lon-a.lon);
 const s=Math.sin(dLa/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(s));};

function popupFor(h){
  const d=document.createElement("div");
  const dd=me?`<div class="pdist">يبعد عنك ${dist(me,h).toFixed(1)} كم تقريبًا (خط مستقيم)</div>`:"";
  d.innerHTML=`<div class="ph" style="background:${RCOL[h.region]}"><p class="pn">${esc(h.name)}</p><div class="pm">${esc(h.gov)} · ${esc(h.region)}</div></div>
  <div class="pbody">${dd}<p class="pa">${h.addr?esc(h.addr):"لا يوجد عنوان في الشيت"}</p>
  <div class="pc">${locText(h)}</div>
  <div class="pb"><button class="btn p" data-a="loc">نسخ اللوكيشن</button><button class="btn" data-a="addr" ${h.addr?"":"disabled"}>نسخ العنوان</button>
  <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${h.lat},${h.lon}">اتجاهات</a>
  <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${h.lat},${h.lon}">فتح في جوجل</a></div></div>`;
  d.querySelector('[data-a="loc"]').onclick=()=>copy(locText(h),"تم نسخ اللوكيشن");
  d.querySelector('[data-a="addr"]').onclick=()=>copy(h.addr,"تم نسخ العنوان");
  return d;
}
const iconFor=h=>L.divIcon({className:"",html:`<div class="pin" style="background:${RCOL[h.region]}"></div>`,iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-14]});
const placed=HUBS.filter(h=>h.lat!=null);
placed.forEach(h=>{
  h.marker=L.marker([h.lat,h.lon],{icon:iconFor(h),title:h.name,riseOnHover:true});
  h.marker.bindPopup(()=>popupFor(h),{maxWidth:320,minWidth:300,autoPanPaddingTopLeft:[30,175],autoPanPaddingBottomRight:[30,30]});
  h.marker.bindTooltip(h.name,{direction:"top",offset:[0,-14]});
});
let clustering=true,layer=null;
function mkLayer(){
  if(layer)map.removeLayer(layer);
  layer=clustering?L.markerClusterGroup({showCoverageOnHover:false,spiderfyOnMaxZoom:true,maxClusterRadius:42,
    iconCreateFunction:c=>{const n=c.getChildCount(),k=n>20?"l":n>6?"m":"s",s=n>20?60:n>6?50:44;return L.divIcon({html:`<div>${n}</div>`,className:"mc "+k,iconSize:[s,s]});}}):L.layerGroup();
  placed.filter(visible).forEach(h=>layer.addLayer(h.marker));
  layer.addTo(map);
}
$("bClu").onclick=()=>{clustering=!clustering;$("bClu").classList.toggle("on",clustering);mkLayer();};

function copy(text,msg){
  const done=ok=>toast(ok?msg:"تعذّر النسخ، انسخ يدويًا");
  const fb=()=>{const ta=document.createElement("textarea");ta.value=text;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();done(ok)};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>done(true),fb);else fb();
}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1600)}
const reveal=h=>{if(clustering&&layer.zoomToShowLayer)layer.zoomToShowLayer(h.marker,()=>h.marker.openPopup());else h.marker.openPopup();};
function openHub(h){
  if(h.lat==null){copy(h.addr,"لا يوجد لوكيشن - تم نسخ العنوان");return;}
  map.setView([h.lat,h.lon],Math.max(map.getZoom(),15),{animate:true});setTimeout(()=>reveal(h),350);
}
function renderList(){
  const box=$("list");box.innerHTML="";let any=false;
  const withD=h=>(me&&h.lat!=null)?dist(me,h):null;
  REGIONS.forEach(r=>{
    const hs=HUBS.filter(h=>h.region===r&&visible(h));if(!hs.length)return;any=true;
    hs.sort((a,b)=>me?((withD(a)??1e9)-(withD(b)??1e9)):a.name.localeCompare(b.name));
    const g=document.createElement("div");g.className="grp";g.innerHTML=`<i style="background:${RCOL[r]}"></i>${r}<small>${hs.length}</small>`;box.appendChild(g);
    hs.forEach(h=>{
      const it=document.createElement("div");it.className="item";const d=withD(h);
      it.innerHTML=`<div class="dot" style="background:${RCOL[r]}">${esc(h.name.trim()[0].toUpperCase())}</div><div class="t"><b>${esc(h.name)}</b><small>${esc(h.gov)}</small></div>${h.lat==null?'<span class="nc">بدون إحداثيات</span>':(d!=null?`<span class="d">${d.toFixed(1)} كم</span>`:"")}`;
      it.onclick=()=>openHub(h);box.appendChild(it);
    });
  });
  if(!any)box.innerHTML='<div class="empty">مفيش فروع مطابقة للبحث</div>';

function fit(){
  const v=placed.filter(visible);
  if(!v.length||v.length===placed.length&&!region&&!govFilter&&!query){map.fitBounds([[22.2,24.9],[31.7,36.6]],{padding:[10,10]});return;}
  if(v.length===1){map.setView([v[0].lat,v[0].lon],13);return;}
  map.fitBounds(L.latLngBounds(v.map(h=>[h.lat,h.lon])),{padding:[60,60],maxZoom:12});

function refresh(doFit){mkLayer();renderList();if(doFit)fit();}

  if(govFilter){const e=document.createElement("button");e.className="chip on";e.innerHTML="المحافظة: "+govFilter+" ×";e.onclick=()=>{govFilter=null;styleGov();chips();refresh(true)};b.appendChild(e);}

    meMarker=L.circleMarker([me.lat,me.lon],{radius:9,color:"#fff",weight:3,fillColor:"#2563eb",fillOpacity:1}).addTo(map).bindTooltip("موقعك");
    const n=placed.slice().sort((a,b)=>dist(me,a)-dist(me,b))[0];
    renderList();map.fitBounds(L.latLngBounds([[me.lat,me.lon],[n.lat,n.lon]]),{padding:[80,80],maxZoom:15});
    setTimeout(()=>reveal(n),500);toast("أقرب فرع: "+n.name);
  },()=>toast("ما قدرتش أحدد موقعك، اسمح بالوصول للموقع"),{enableHighAccuracy:true,timeout:10000});
};
$("sN").textContent=HUBS.length;$("sP").textContent=placed.length;
$("legend").innerHTML=REGIONS.map((r,i)=>`<div><i style="background:${RHEX[i]}"></i>${r}</div>`).join("");
chips();refresh(true);styleGov();govLabels();
if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener&&matchMedia("(prefers-color-scheme: dark)").addEventListener("change",styleGov);
</script>
